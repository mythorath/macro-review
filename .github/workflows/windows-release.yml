name: Windows release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel for manual publish (preview|stable)"
        required: false
        default: "preview"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gui.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install requests tqdm

      - name: Compile all modules
        run: python -m compileall -q .

      - name: Import smoke
        run: |
          python -c "import gui, main, bootstrap, paths, setup_env, version_info"
          python -c "from gui.app import run; print('gui.app ok')"

      - name: Unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q

      - name: Source GUI smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m gui --smoke-test

      - name: Doctor JSON (CPU path)
        run: python main.py doctor --json

      - name: Setup dry-run
        run: python main.py setup --dry-run --yes

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine channel
        id: meta
        shell: pwsh
        run: |
          $channel = "preview"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $channel = "stable"
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Stable tags must be vX.Y.Z (got $tag)"
            }
            $ver = $Matches[1]
            $fileVer = (Select-String -Path version_info.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
            if ($ver -ne $fileVer) {
              throw "Tag version $ver does not match version_info.APP_VERSION=$fileVer"
            }
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $channel = "${{ github.event.inputs.channel }}"
            if (-not $channel) { $channel = "preview" }
          }
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build portable ZIP
        shell: pwsh
        run: |
          ./packaging/build.ps1 -Channel ${{ steps.meta.outputs.channel }} -Commit $env:GITHUB_SHA

      - name: Packaged version + smoke
        shell: pwsh
        run: |
          $exe = "dist/MacroReview/MacroReview.exe"
          & $exe --version
          $env:QT_QPA_PLATFORM = "offscreen"
          & $exe --smoke-test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macroreview-win64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.manifest.json
          if-no-files-found: error

      # Optional future step: Authenticode / Azure Artifact Signing.
      # Keep gated behind secrets so unsigned preview builds continue to work.
      # - name: Sign binaries
      #   if: ${{ secrets.CODE_SIGNING_ENABLED == 'true' }}
      #   run: echo "Wire signing here without changing the package layout."

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: macroreview-win64-${{ github.sha }}
          path: release-assets

      - name: Publish rolling preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = $env:GITHUB_SHA
          $short = $sha.Substring(0, 7)
          $assets = Get-ChildItem release-assets -File
          if (-not $assets) { throw "No release assets found" }

          $notes = @"
          Rolling preview build from ``main``.

          Commit: $sha
          This prerelease is overwritten on every successful ``main`` build.
          Unsigned downloads may trigger Windows SmartScreen — More info → Run anyway.
          Extract the ZIP and run ``MacroReview.exe``. Requires system Python 3.11+ for Setup.
          "@

          # Move preview tag to this commit.
          git tag -f preview $sha
          git push -f origin refs/tags/preview

          if (gh release view preview 2>$null) {
            gh release edit preview --prerelease --latest=false --title "Preview (rolling)" --notes $notes --target $sha
          } else {
            gh release create preview --prerelease --latest=false --title "Preview (rolling)" --notes $notes --target $sha
          }

          # Upload new assets, then remove older preview artifacts that do not match this SHA.
          $paths = @($assets | ForEach-Object { $_.FullName })
          gh release upload preview @paths --clobber

          $view = gh release view preview --json assets | ConvertFrom-Json
          foreach ($asset in $view.assets) {
            $name = $asset.name
            $isPreviewArtifact = $name -like "MacroReview-*-preview-*-win64.zip*" -or
              $name -like "MacroReview-*-preview-*-win64.zip.sha256" -or
              $name -like "MacroReview-*-preview-*-win64.manifest.json"
            if ($isPreviewArtifact -and $name -notlike "*-$short-*") {
              Write-Host "Deleting old preview asset $name"
              gh release delete-asset preview $name --yes
            }
          }

  publish-stable:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: macroreview-win64-${{ github.sha }}
          path: release-assets

      - name: Publish immutable stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem release-assets -File
          if (-not $assets) { throw "No release assets found" }

          if (gh release view $tag 2>$null) {
            throw "Stable release $tag already exists and must not be overwritten"
          }

          gh release create $tag `
            --title $tag `
            --generate-notes `
            --latest `
            --target $env:GITHUB_SHA `
            $assets.FullName
